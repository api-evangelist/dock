aid: dock
name: Dock
description: 'Dock is a Latin American financial technology infrastructure provider — formerly
  Conductor Technology — that delivers card issuing and processing, core banking, digital
  accounts and wallets, Pix instant payments, bank slips, acquiring, loyalty/benefits and
  transactional anti-fraud from a single cloud-native platform marketed as Dock One. Dock
  operates in Brazil as a payment institution regulated by the Banco Central do Brasil (bank
  code 301) and states that it serves more than 400 companies across 11 countries, processes
  roughly R$1.4 trillion in annual card volume and supports around 70 million active digital
  accounts. Its API estate is branded Caradhras and is reached through the api.caradhras.io
  gateway; the developer reference at developers.dock.tech is a private ReadMe hub that
  redirects anonymous visitors to a login, and the previously public Caradhras reference at
  lighthouse.dock.tech no longer resolves.'
