- aid: dock:caradhras
  name: Dock Caradhras API
  description: 'Dock''s financial infrastructure API, branded Caradhras, covering card issuing
    and processing, digital accounts, transfers, Pix, bank slips and acquiring. The gateway is
    live at api.caradhras.io (AWS API Gateway) and answers every unauthenticated request with
    HTTP 430 and an x-dock-errortype: AuthorizationError header. The reference is published in
    a private ReadMe developer hub at developers.dock.tech that is not readable without an
    account, so no machine-readable OpenAPI is publicly available.'
