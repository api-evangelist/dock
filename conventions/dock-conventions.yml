  body:
    content_type: application/json
    shape: '{"error": "<message>"}'
    example_observed: '{"error": "access denied"}'
  headers:
  - name: x-dock-errortype
    observed_value: AuthorizationError
    note: Dock's own error classification, returned alongside the AWS one.
  - name: x-dock-errorcode
    observed_value: ''
    note: Present but empty on anonymous rejections; carries a code on authenticated errors.
  - name: x-dock-errormessage
    observed_value: ''
    note: Present but empty on anonymous rejections.
  - name: x-amzn-errortype
    observed_value: ForbiddenException
  rfc9457: false
  note: >-
    Dock signals errors in BOTH a JSON body and a set of x-dock-* headers. The header trio
    (x-dock-errortype / x-dock-errorcode / x-dock-errormessage) is the machine-readable
    surface; the body is a bare {"error": string}. It is not RFC 9457 problem+json.
    HTTP 430 is not a registered IANA status code — a generic HTTP client will treat it as
    an unclassified 4xx, which is a real interoperability cost for agents and SDKs.

