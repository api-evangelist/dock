note: >-
  Dock publishes no public error reference — the reference lives in a private ReadMe hub at
  developers.dock.tech. This catalog is therefore NOT the provider's published catalog: it is
  the error envelope observed on the wire from the live Caradhras gateway, plus the one error
  type that could be triggered anonymously. It is deliberately thin; a future round should
  replace it with the published reference if Dock opens the hub.
